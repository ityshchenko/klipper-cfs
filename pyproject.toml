[project]
name = "klipper-cfs"
version = "0.1.0"
description = "A Python module for controlling the Creality File System (CFS) from Klipper firmware"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license-files = ["LICEN[CS]E*"]
authors = [
    {name = "Klipper-CFS Contributors"}
]
keywords = ["klipper", "3d-printing", "creality", "cfs", "filament"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Hardware",
]

dependencies = [
    "pyserial>=3.5",
]

[project.urls]
"Homepage" = "https://github.com/yourusername/klipper-cfs"
"Bug Tracker" = "https://github.com/yourusername/klipper-cfs/issues"

[project.optional-dependencies]
dev = [
    "typer>=0.12.0",
    "typing-extensions>=4.0.0; python_version < '3.9'",
    "pytest>=8.3.5",
]

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["creality_cfs"]

[tool.setuptools.package-dir]
"" = "extras"

[tool.pytest.ini_options]
pythonpath = [
  "extras"
]
